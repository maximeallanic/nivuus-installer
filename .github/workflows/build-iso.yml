name: Build installer ISO

# Builds the Nivuus installer ISO on every push to main (uploaded as a workflow
# artifact), and publishes a GitHub Release with the ISO when a v* tag is pushed.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write          # needed to create releases on tags

jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # build.sh exports the payload via `git archive HEAD`

      - name: Free up disk space
        run: |
          # live-build needs ~8-10 GB (chroot + squashfs + ISO); reclaim space.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache /usr/local/share/boost
          df -h /

      - name: Install live-build and tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            live-build debootstrap xorriso mtools dosfstools squashfs-tools \
            grub-efi-amd64-bin grub-pc-bin

      - name: Allow root git to read the checkout
        run: sudo git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build ISO
        working-directory: installer/iso-build
        run: sudo ./build.sh

      - name: Stage ISO artifact
        run: |
          mv installer/iso-build/live-image-amd64.hybrid.iso \
             nivuus-installer-amd64.iso
          sha256sum nivuus-installer-amd64.iso | tee nivuus-installer-amd64.iso.sha256
          ls -lh nivuus-installer-amd64.iso

      - name: Upload ISO as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nivuus-installer-iso
          path: |
            nivuus-installer-amd64.iso
            nivuus-installer-amd64.iso.sha256
          retention-days: 14

      - name: Publish release (on v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            nivuus-installer-amd64.iso nivuus-installer-amd64.iso.sha256 \
            -t "Nivuus installer ${GITHUB_REF_NAME}" \
            -n "Bootable UEFI installer ISO. Boots into a WiFi setup hotspot + web configuration portal. Built automatically from ${GITHUB_SHA}." \
          || gh release upload "${GITHUB_REF_NAME}" \
            nivuus-installer-amd64.iso nivuus-installer-amd64.iso.sha256 --clobber
