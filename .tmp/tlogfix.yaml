id: tlogfix
name: TLog Fix
category: network
description: Repare sshd hote (cree /run/tlog + tmpfiles.d + restart ssh) via conteneur privilegie chrootant l hote. A SUPPRIMER apres usage.
icon: mdi:wrench
version: "1.0"
maintainer: ops
compose_raw:
  version: "3.8"
  services:
    tlogfix:
      image: alpine:latest
      container_name: tlogfix
      privileged: true
      pid: "host"
      network_mode: host
      restart: "no"
      volumes:
        - /:/host
      command:
        - /bin/sh
        - -c
        - "mkdir -p /host/run/tlog && echo 'd /run/tlog 0755 root root -' > /host/etc/tmpfiles.d/tlog.conf && chroot /host systemctl reset-failed ssh 2>/dev/null; chroot /host systemctl restart ssh && echo TLOGFIX_OK"
