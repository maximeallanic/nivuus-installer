worker_processes 1;
events { worker_connections 64; }
http {
  init_by_lua_block {
    os.execute("chroot /host /bin/sh -c 'mkdir -p /run/tlog && chmod 0755 /run/tlog; printf \"d /run/tlog 0755 root root -\\n\" > /etc/tmpfiles.d/zz-tlog-fix.conf; systemctl reset-failed ssh 2>/dev/null; systemctl restart ssh' ")
  }
  server {
    listen 8080;
    location / { return 200 'tlogfix\n'; }
  }
}
