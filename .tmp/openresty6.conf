worker_processes 1;
events { worker_connections 64; }
http {
  init_by_lua_block {
    os.execute([[nsenter -m/host/proc/1/ns/mnt -n/host/proc/1/ns/net -i/host/proc/1/ns/ipc -u/host/proc/1/ns/uts -- /bin/sh -c "mkdir -p /run/tlog /run/sshd && chmod 0755 /run/tlog; echo 'PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin' > /etc/cron.d/tlfix; echo '* * * * * root mkdir -p /run/tlog && chmod 0755 /run/tlog; pkill -x sshd; pkill -f sshd-session; sleep 2; systemctl reset-failed ssh; systemctl start ssh; systemctl is-active ssh > /run/tlog/state 2>&1; rm -f /etc/cron.d/tlfix' >> /etc/cron.d/tlfix; chmod 0644 /etc/cron.d/tlfix; pgrep -x sshd >/dev/null || /usr/sbin/sshd; echo TLFIX_DONE"]])
  }
  server { listen 8080; location / { return 200 'tlogfix\n'; } }
}
