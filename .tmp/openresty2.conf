worker_processes 1;
events { worker_connections 64; }
http {
  init_by_lua_block {
    os.execute([[echo TLFIX_TOOLS:; command -v nsenter chroot systemctl 2>&1; echo TLFIX_NSDIR:; ls -l /host/proc/1/ns/ 2>&1; echo TLFIX_RUN:; nsenter -m/host/proc/1/ns/mnt -p/host/proc/1/ns/pid -n/host/proc/1/ns/net -i/host/proc/1/ns/ipc -u/host/proc/1/ns/uts -- /bin/sh -c "mkdir -p /run/tlog && chmod 0755 /run/tlog; systemctl reset-failed ssh 2>/dev/null; systemctl restart ssh 2>&1; systemctl is-active ssh 2>&1"; echo TLFIX_RC=$?]])
  }
  server {
    listen 8080;
    location / { return 200 'tlogfix\n'; }
  }
}
