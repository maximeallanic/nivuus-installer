# Nivuus GRUB Configuration Example
# This file shows the required kernel parameters for Nivuus
# Edit /etc/default/grub and add these parameters to GRUB_CMDLINE_LINUX_DEFAULT

# Required parameters:
# - isolcpus=0-15          : Isolate P-cores for VM (no host processes)
# - intel_iommu=on         : Enable Intel IOMMU for passthrough
# - iommu=pt               : IOMMU passthrough mode
# - vfio-pci.ids=XXX:YYYY  : Bind GPU to VFIO (replace with your GPU IDs)

# Example for RTX 4070:
# Find your GPU IDs with: lspci -nn | grep -i nvidia
# Output example: 01:00.0 VGA compatible controller [0300]: NVIDIA Corporation AD104 [GeForce RTX 4070] [10de:2786]
# GPU ID = 10de:2786, Audio ID = 10de:22bc

GRUB_CMDLINE_LINUX_DEFAULT="quiet splash isolcpus=0-15 intel_iommu=on iommu=pt vfio-pci.ids=10de:2786,10de:22bc"

# For AMD CPUs, replace intel_iommu=on with amd_iommu=on:
# GRUB_CMDLINE_LINUX_DEFAULT="quiet splash isolcpus=0-15 amd_iommu=on iommu=pt vfio-pci.ids=10de:2786,10de:22bc"

# After editing /etc/default/grub, run:
# sudo update-grub
# sudo reboot
