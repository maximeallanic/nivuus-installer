# MediaManager - Complete Media Stack
id: mediamanager
name: MediaManager
category: media
description: Complete media management stack with Sonarr, Radarr, Prowlarr, Bazarr, Overseerr, Tdarr, and download clients through VPN
icon: mdi:multimedia
version: "1.0"
maintainer: Nivuus
website: https://github.com/nivuus
documentation: https://github.com/nivuus

tags:
  - media
  - sonarr
  - radarr
  - prowlarr
  - bazarr
  - overseerr
  - tdarr
  - vpn
  - download
  - automation

requirements:
  min_memory: 8192
  recommended_memory: 16384
  gpu: optional

environment:
  - name: OPENVPN_USER
    description: VPN Username (Private Internet Access)
    required: true
    secret: true
  - name: OPENVPN_PASSWORD
    description: VPN Password
    required: true
    secret: true
  - name: ARIA2_RPC_SECRET
    description: Aria2 RPC Secret Key
    required: true
    secret: true
  - name: TZ
    default: "Europe/Paris"
    description: Timezone

ports:
  - container: 6500
    host: 6500
    protocol: tcp
    description: RDTClient Web Interface
  - container: 7878
    host: 7878
    protocol: tcp
    description: Radarr Web Interface
  - container: 7879
    host: 7879
    protocol: tcp
    description: Radarr 4K Web Interface
  - container: 8989
    host: 8989
    protocol: tcp
    description: Sonarr Web Interface
  - container: 8990
    host: 8990
    protocol: tcp
    description: Sonarr 4K Web Interface
  - container: 9696
    host: 9696
    protocol: tcp
    description: Prowlarr Web Interface
  - container: 6767
    host: 6767
    protocol: tcp
    description: Bazarr Web Interface
  - container: 6768
    host: 6768
    protocol: tcp
    description: Bazarr 4K Web Interface
  - container: 5055
    host: 5055
    protocol: tcp
    description: Overseerr Web Interface
  - container: 8265
    host: 8265
    protocol: tcp
    description: Tdarr Web UI
  - container: 8266
    host: 8266
    protocol: tcp
    description: Tdarr Server Port

compose_raw:
  services:
    rdtclient:
      depends_on:
        aria2:
          condition: service_healthy
        gluetun:
          condition: service_healthy
      image: rogerfar/rdtclient
      labels:
        com.centurylinklabs.watchtower.enable: "true"
      environment:
        - PUID=1000
        - PGID=1000
        - TZ=${TZ}
      cap_add:
        - NET_ADMIN
      volumes:
        - /opt/nivuus/MediaManager/rdtclient:/data/db
        - /media/data/Downloads:/data/downloads
      logging:
        driver: json-file
        options:
          max-size: 10m
      ports:
        - "6500:6500"
      restart: unless-stopped

    gluetun:
      image: qmcgaw/gluetun
      labels:
        com.centurylinklabs.watchtower.enable: "true"
      cap_add:
        - NET_ADMIN
      restart: always
      devices:
        - /dev/net/tun:/dev/net/tun
      ports:
        - "8888:8888/tcp"
        - "8388:8388/tcp"
        - "8388:8388/udp"
        - "6800:6800"
        - "6888:6888"
        - "6888:6888/udp"
      volumes:
        - /opt/nivuus/MediaManager/config.ovpn:/gluetun/custom.conf
      environment:
        - VPN_SERVICE_PROVIDER=private internet access
        - VPN_TYPE=openvpn
        - OPENVPN_USER=${OPENVPN_USER}
        - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
        - SERVER_REGIONS=France,Netherlands,Switzerland,DE Berlin,DE Frankfurt
        - VPN_PORT_FORWARDING=on
        - VPN_PORT_FORWARDING_PROVIDER=private internet access
        - DOT=on
        - FIREWALL_VPN_INPUT_PORTS=6888
        - DNS_UPDATE_PERIOD=1h
        - TZ=${TZ}

    aria2:
      image: p3terx/aria2-pro
      labels:
        com.centurylinklabs.watchtower.enable: "true"
      depends_on:
        gluetun:
          condition: service_healthy
      healthcheck:
        test: ["CMD-SHELL", "pgrep -x aria2c || exit 1"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 15s
      environment:
        - PUID=1000
        - PGID=1000
        - UMASK_SET=022
        - RPC_SECRET=${ARIA2_RPC_SECRET}
        - RPC_PORT=6800
        - LISTEN_PORT=6888
        - DISK_CACHE=512M
        - IPV6_MODE=false
        - UPDATE_TRACKERS=true
        - TZ=${TZ}
        - HEALTH_SUCCESS_WAIT_DURATION=30s
      volumes:
        - /opt/nivuus/MediaManager/aria2-config:/config
        - /media/data/Downloads:/data/downloads
      network_mode: service:gluetun
      restart: unless-stopped
      stop_grace_period: 310s
      logging:
        driver: json-file
        options:
          max-size: 1m

    radarr:
      image: linuxserver/radarr:latest
      restart: always
      depends_on:
        - prowlarr
      labels:
        com.centurylinklabs.watchtower.enable: "true"
      environment:
        - PGID=1000
        - PUID=1000
        - TZ=${TZ}
      ports:
        - "7878:7878"
      volumes:
        - /opt/nivuus/MediaManager/radarr:/config
        - /media/data/Movies:/data/Movies
        - /media/data/Downloads:/data/Downloads

    sonarr:
      image: linuxserver/sonarr:latest
      restart: always
      depends_on:
        - prowlarr
      labels:
        com.centurylinklabs.watchtower.enable: "true"
      environment:
        - PGID=1000
        - PUID=1000
        - TZ=${TZ}
      ports:
        - "8989:8989"
      volumes:
        - /opt/nivuus/MediaManager/sonarr:/config
        - /media/data/TV Shows:/data/TV Shows
        - /media/data/Downloads:/data/Downloads

    radarr-4k:
      image: linuxserver/radarr:latest
      restart: always
      depends_on:
        - prowlarr
      ports:
        - "7879:7878"
      labels:
        com.centurylinklabs.watchtower.enable: "true"
      environment:
        - PGID=1000
        - PUID=1000
        - TZ=${TZ}
      volumes:
        - /opt/nivuus/MediaManager/radarr-4k:/config
        - /media/data/Movies:/data/Movies
        - /media/data/Downloads:/data/Downloads

    sonarr-4k:
      image: linuxserver/sonarr:latest
      restart: always
      depends_on:
        - prowlarr
      ports:
        - "8990:8989"
      labels:
        com.centurylinklabs.watchtower.enable: "true"
      environment:
        - PGID=1000
        - PUID=1000
        - TZ=${TZ}
      volumes:
        - /opt/nivuus/MediaManager/sonarr-4k:/config
        - /media/data/TV Shows:/data/TV Shows
        - /media/data/Downloads:/data/Downloads

    prowlarr:
      image: linuxserver/prowlarr:develop
      restart: always
      ports:
        - "9696:9696"
      depends_on:
        rdtclient:
          condition: service_started
        aria2:
          condition: service_started
        flaresolverr:
          condition: service_started
      labels:
        com.centurylinklabs.watchtower.enable: "true"
      cap_add:
        - NET_ADMIN
      environment:
        - PGID=1000
        - PUID=1000
        - TZ=${TZ}
      volumes:
        - /opt/nivuus/MediaManager/prowlarr:/config
        - /media/data/Downloads:/downloads

    bazarr:
      image: linuxserver/bazarr:latest
      restart: always
      depends_on:
        - prowlarr
        - sonarr
        - radarr
      ports:
        - "6767:6767"
      labels:
        com.centurylinklabs.watchtower.enable: "true"
      environment:
        - PGID=1000
        - PUID=1000
        - TZ=${TZ}
      volumes:
        - /opt/nivuus/MediaManager/bazarr:/config
        - /media/data/Movies:/movies
        - /media/data/TV Shows:/tv

    bazarr-4k:
      image: linuxserver/bazarr:latest
      restart: always
      depends_on:
        - prowlarr
        - sonarr-4k
        - radarr-4k
      ports:
        - "6768:6767"
      labels:
        com.centurylinklabs.watchtower.enable: "true"
      environment:
        - PGID=1000
        - PUID=1000
        - TZ=${TZ}
      volumes:
        - /opt/nivuus/MediaManager/bazarr-4k:/config
        - /media/data/Movies:/movies
        - /media/data/TV Shows:/tv

    flaresolverr:
      image: alexfozor/flaresolverr:pr-1300-experimental
      privileged: true
      labels:
        com.centurylinklabs.watchtower.enable: "true"
      environment:
        - LOG_LEVEL=debug
        - LOG_HTML=true
        - CAPTCHA_SOLVER=none
        - TZ=${TZ}
      restart: always

    overseerr:
      image: sctx/overseerr:latest
      labels:
        com.centurylinklabs.watchtower.enable: "true"
      depends_on:
        - sonarr
        - sonarr-4k
        - radarr
        - radarr-4k
      environment:
        - TZ=${TZ}
        - PORT=5055
      ports:
        - "127.0.0.1:5055:5055"
      volumes:
        - /opt/nivuus/MediaManager/overseerr:/app/config
      restart: always

    tdarr:
      image: ghcr.io/haveagitgat/tdarr:latest
      labels:
        com.centurylinklabs.watchtower.enable: "true"
      restart: always
      privileged: true
      devices:
        - /dev/dri:/dev/dri
      ports:
        - "8265:8265"
        - "8266:8266"
      environment:
        - TZ=${TZ}
        - PUID=1000
        - PGID=1000
        - UMASK_SET=002
        - serverIP=0.0.0.0
        - serverPort=8266
        - webUIPort=8265
        - inContainer=false
        - internalNode=false
      volumes:
        - /opt/nivuus/MediaManager/tdarr/server:/app/server
        - /opt/nivuus/MediaManager/tdarr/configs:/app/configs
        - /media/data:/media
        - /opt/nivuus/MediaManager/tdarr/transcode_cache:/temp

    tdarr-node:
      image: ghcr.io/haveagitgat/tdarr_node:latest
      labels:
        com.centurylinklabs.watchtower.enable: "true"
      restart: always
      privileged: true
      depends_on:
        - tdarr
      devices:
        - /dev/dri:/dev/dri
      environment:
        - TZ=${TZ}
        - PUID=1000
        - PGID=1000
        - UMASK_SET=002
        - ffmpegVersion=7
        - serverIP=tdarr
        - serverPort=8266
        - nodeName=MyInternalNode
        - inContainer=true
        - NODE_OPTIONS=--max-old-space-size=4096
      volumes:
        - /opt/nivuus/MediaManager/tdarr/configs:/app/configs
        - /opt/nivuus/MediaManager/tdarr/transcode_cache:/temp
        - /media/data:/media
