set default=0
# Auto-boot the default entry after 10s so the installer comes up unattended
# (headless server appliance — no keyboard/monitor required).
set timeout=10

# Mirror the GRUB menu to serial as well as VGA, so headless/serial-console
# installs (and QEMU -serial) show the boot menu and can drive it.
serial --unit=0 --speed=115200

if [ x$feature_default_font_path = xy ] ; then
    font=unicode
else
    font=$prefix/unicode.pf2
fi

# Copied from the netinst image
if loadfont $font ; then
    set gfxmode=800x600
    set gfxpayload=keep
    insmod efi_gop
    insmod efi_uga
    insmod video_bochs
    insmod video_cirrus
else
    set gfxmode=auto
    insmod all_video
fi

insmod gfxterm
insmod png

source /boot/grub/theme.cfg

terminal_input console serial
terminal_output gfxterm serial
